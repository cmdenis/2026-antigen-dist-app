<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ligand Cn/Cn(0) Explorer</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Ligand distribution &mdash; Cn / Cn(0) explorer</h1>

  <div class="layout">
    <aside class="controls">
      <fieldset>
        <legend>Agonist</legend>
        <label>
          log&#8321;&#8320;(mean&#8321;)
          <input type="range" id="m1" min="-2" max="2" step="0.1" value="0">
          <span class="val" id="m1-out">0</span>
        </label>
        <label>
          std&#8321;
          <input type="range" id="std1" min="0.1" max="5" step="0.1" value="1">
          <span class="val" id="std1-out">1</span>
        </label>
      </fieldset>

      <fieldset>
        <legend>Antagonist</legend>
        <label>
          log&#8321;&#8320;(mean&#8322;)
          <input type="range" id="m2" min="-2" max="2" step="0.1" value="0">
          <span class="val" id="m2-out">0</span>
        </label>
        <label>
          std&#8322;
          <input type="range" id="std2" min="0.1" max="5" step="0.1" value="1">
          <span class="val" id="std2-out">1</span>
        </label>
      </fieldset>

      <fieldset>
        <legend>Constants</legend>
        <label>
          L&#8321;
          <input type="number" id="L1" value="1000" step="50">
        </label>
        <label>
          L&#8322;
          <input type="number" id="L2" value="1000" step="50">
        </label>
      </fieldset>
    </aside>

    <main class="plots">
      <div class="plot plot-lines">
        <canvas id="linesCanvas" width="560" height="440"></canvas>
      </div>
      <div class="plot plot-heat">
        <canvas id="heatCanvas" width="560" height="240"></canvas>
      </div>
      <div class="plot plot-slices">
        <canvas id="slicesCanvas" width="560" height="240"></canvas>
      </div>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
